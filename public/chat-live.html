<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

<title>Working in the Moon — Live</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e8e8e8'%3E%3Cpath d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Moon" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  /* ── chat-live page-local styles ───────────────────────────────────── */
  .live-load-earlier {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin: 8px 0 12px;
    padding: 10px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--fg-dim);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background 150ms;
  }
  .live-load-earlier:hover { background: var(--bg-elev-3); color: var(--fg); }
  .live-load-earlier:disabled { opacity: 0.7; cursor: progress; }
  .live-load-earlier i, .live-load-earlier svg { width: 14px; height: 14px; }

  .live-streaming-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
    color: var(--fg-dim);
    font-size: 13px;
  }
  .live-streaming-indicator i, .live-streaming-indicator svg {
    width: 14px;
    height: 14px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    line-height: 1.4;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .live-source-pill {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 99px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    line-height: 1.4;
  }
  .chat-header-cwd {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 60ch;
  }
  .live-subheader {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    font-size: 12px;
    color: var(--fg-dim);
    flex-wrap: wrap;
  }
  .live-subheader .meta-pid {
    font-family: var(--mono);
  }
  .live-subheader .meta-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
  }
  .live-subheader .meta-status.busy { color: var(--accent); border-color: var(--accent); }
  .live-subheader .meta-status.idle { color: var(--success); border-color: var(--success); }
  .live-subheader .meta-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  /* Override the global hint behaviour: chat-live always shows the cmux
     status hint (mobile-first). It's a different signal than chat.html's
     desktop-only keyboard tip. */
  .chat-input-hint.live-cmux-hint {
    display: block;
    margin-top: 6px;
  }
  .chat-input-hint.live-cmux-hint.unavailable {
    color: var(--danger);
  }
  .agent-mark {
    width: 18px;
    height: 18px;
    object-fit: contain;
    flex-shrink: 0;
    opacity: 0.85;
  }

  /* Optimistic-send marker on user bubbles awaiting jsonl confirmation. */
  .msg-row.user .msg-bubble.optimistic {
    opacity: 0.65;
    border: 1px dashed var(--accent);
  }
  .msg-row.user .msg-bubble.optimistic::after {
    content: "보냄 · 전달 확인 대기";
    display: block;
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--fg-dim);
  }
  .msg-row.user .msg-bubble.optimistic.confirmed {
    opacity: 1;
    border-style: solid;
  }
  .msg-row.user .msg-bubble.optimistic.confirmed::after {
    content: "보냄 · 확인됨";
    color: var(--success);
  }

  /* Terminal-preview panel (HITL surfacing). */
  .live-terminal-panel {
    border-top: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.4;
    max-height: 240px;
    overflow: auto;
    padding: 8px 12px;
    white-space: pre;
    -webkit-user-select: text;
    user-select: text;
  }
  .live-terminal-panel[hidden] { display: none; }
  .live-terminal-panel .live-terminal-empty {
    color: var(--fg-dim);
    font-family: inherit;
    white-space: normal;
  }
  .live-terminal-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-elev-2);
    font-size: 11px;
    color: var(--fg-dim);
  }
  .live-terminal-toolbar button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .live-terminal-toolbar button:hover { color: var(--fg); border-color: var(--fg-dim); }
  .live-terminal-toolbar button.active { color: var(--accent); border-color: var(--accent); }
  .live-terminal-toolbar button i, .live-terminal-toolbar button svg { width: 12px; height: 12px; }
  .live-terminal-toolbar .live-terminal-status { margin-left: auto; }

  /* AskUserQuestion picker (inline buttons inside tool card body). */
  .tool-body-ask { padding: 0; }
  .ask-picker { display: flex; flex-direction: column; gap: 14px; padding: 10px 12px; }
  .ask-question { display: flex; flex-direction: column; gap: 6px; }
  .ask-header {
    display: inline-block;
    width: max-content;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .ask-text { font-size: 13px; color: var(--fg); line-height: 1.4; font-weight: 500; }
  .ask-options { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .ask-option {
    display: grid;
    grid-template-columns: 24px 1fr;
    grid-template-rows: auto auto;
    column-gap: 10px;
    row-gap: 2px;
    text-align: left;
    background: var(--bg-elev, rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    line-height: 1.35;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .ask-option:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.04);
  }
  .ask-option:active:not(:disabled) { transform: scale(0.99); }
  .ask-option:disabled { cursor: default; opacity: 0.75; }
  .ask-option-num {
    grid-row: 1 / span 2;
    align-self: start;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.06);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
  }
  .ask-option-label { font-weight: 500; color: var(--fg); align-self: center; }
  .ask-option-desc {
    grid-column: 2;
    grid-row: 2;
    font-size: 11px;
    color: var(--fg-dim);
    line-height: 1.4;
  }
  .ask-option.sent {
    border-color: var(--accent);
    background: rgba(99, 179, 237, 0.10);
  }
  .ask-option.sent .ask-option-num {
    background: var(--accent);
    color: var(--bg, #0b0d10);
  }
  .ask-option.chosen {
    border-color: var(--success);
    background: rgba(72, 187, 120, 0.10);
  }
  .ask-option.chosen .ask-option-num {
    background: var(--success);
    color: var(--bg, #0b0d10);
  }
  .ask-multi-note {
    font-size: 11px;
    color: var(--fg-dim);
    font-style: italic;
    margin-top: 2px;
  }
</style>
</head>
<body class="chat-page live-page">

<!-- ── Header ─────────────────────────────────────────────────── -->
<header class="chat-header" id="chatHeader">
  <div class="chat-header-inner">
    <div class="chat-header-left">
      <a href="/" class="chat-back-btn" id="backBtn" aria-label="홈으로">
        <i data-lucide="chevron-left"></i>
      </a>
      <span class="chat-project-name" id="projectNameLabel">—</span>
      <img id="agentMark" class="agent-mark" src="" alt="" aria-hidden="true" hidden />
      <span class="live-badge" id="liveBadge">LIVE</span>
      <span class="live-source-pill" id="liveSourcePill" hidden>—</span>
      <span class="conn-dot" id="connDot" data-state="connecting" aria-hidden="true"></span>
    </div>

    <div class="chat-header-center">
      <div class="chat-busy-indicator" id="busyIndicator">
        <span class="spin"><i data-lucide="loader-2"></i></span>
        <span class="busy-label">사용 중…</span>
      </div>
    </div>

    <div class="chat-header-right">
      <!-- intentionally empty for read-only -->
    </div>
  </div>
</header>

<!-- ── Sub-header (cwd + pid) ─────────────────────────────────── -->
<div class="live-subheader" id="liveSubheader">
  <span class="chat-header-cwd" id="liveCwd" title=""></span>
  <span class="meta-pid" id="livePid"></span>
  <span class="meta-pid" id="liveStartedAt"></span>
  <span class="meta-status idle" id="liveStatus">
    <span class="dot"></span>
    <span class="label">대기 중</span>
  </span>
</div>

<!-- ── Messages area ──────────────────────────────────────────── -->
<main class="chat-messages" id="chatMessages" aria-live="polite">
  <div class="chat-messages-inner">
    <button class="live-load-earlier" id="liveLoadEarlierBtn" type="button" hidden>
      <i data-lucide="arrow-up"></i>
      <span>이전 메시지 불러오기</span>
    </button>
    <div class="chat-empty" id="emptyState">
      <i data-lucide="messages-square"></i>
      <span>전사 기록을 불러오는 중…</span>
    </div>
  </div>
</main>

<!-- ── Scroll-to-bottom button ────────────────────────────────── -->
<button class="chat-scroll-btn" id="scrollBtn" aria-label="최신 메시지로">
  <i data-lucide="arrow-down"></i>
  <span>최신</span>
</button>

<!-- ── Toast ──────────────────────────────────────────────────── -->
<div class="chat-toast" id="chatToast" role="alert" aria-live="assertive">
  <i data-lucide="alert-circle" id="chatToastIcon"></i>
  <span id="chatToastText"></span>
</div>

<!-- ── Disconnect banner ──────────────────────────────────────── -->
<div class="chat-disconnect-banner" id="disconnectBanner" style="display:none;">
  <i data-lucide="wifi-off"></i>
  <span>연결이 끊어졌습니다. 새로고침하세요.</span>
  <button id="refreshBtn">새로고침</button>
</div>

<!-- ── Slash command picker ───────────────────────────────────── -->
<div class="slash-picker" id="slashPicker" role="listbox" aria-label="슬래시 커맨드" hidden>
  <div class="slash-picker-list" id="slashPickerList"></div>
  <div class="slash-picker-empty" id="slashPickerEmpty" hidden>일치하는 명령이 없습니다.</div>
</div>

<!-- ── Terminal preview (HITL surfacing) ──────────────────────── -->
<pre class="live-terminal-panel" id="liveTerminalPanel" hidden aria-label="외부 세션 터미널 미리보기"></pre>
<div class="live-terminal-toolbar" id="liveTerminalToolbar">
  <button id="liveTerminalToggle" type="button" aria-pressed="false" title="외부 세션의 현재 화면(권한·플랜 메뉴 등 HITL)">
    <i data-lucide="monitor"></i>
    <span>터미널 보기</span>
  </button>
  <button id="liveTerminalRefresh" type="button" hidden title="지금 새로고침">
    <i data-lucide="refresh-cw"></i>
  </button>
  <span class="live-terminal-status" id="liveTerminalStatus"></span>
</div>

<!-- ── Input bar (cmux-routed) ────────────────────────────────── --><footer class="chat-input-bar">
  <!-- Pending attachments (chips, above the textarea) -->
  <div class="chat-attach-strip" id="liveAttachStrip" hidden></div>
  <div class="chat-input-inner">
    <button class="chat-attach-btn" id="liveAttachBtn" type="button" aria-label="파일 첨부" disabled>
      <i data-lucide="paperclip"></i>
    </button>
    <input
      type="file"
      id="liveFileInput"
      multiple
      accept="image/*,application/pdf,text/*"
      hidden
    />
    <textarea
      id="liveTextarea"
      class="chat-textarea"
      placeholder="외부 세션에 메시지 보내기…"
      rows="1"
      aria-label="메시지 입력"
      disabled
    ></textarea>
    <button id="liveSendBtn" class="chat-send-btn" aria-label="전송" disabled>
      <i data-lucide="send"></i>
    </button>
  </div>
  <div class="chat-input-hint live-cmux-hint" id="liveCmuxStatus">연결 중…</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@7.0.0/dist/diff.min.js"></script>
<script src="/static/chat-live.js?v=20260513a"></script>
</body>
</html>
